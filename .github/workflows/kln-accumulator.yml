name: kln-accumulator

# README.md is not ignored: it is compiled as doc tests.
on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE-APACHE
      - LICENSE-MIT
      - SECURITY.md
  push:
    branches: main
    paths-ignore:
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE-APACHE
      - LICENSE-MIT
      - SECURITY.md
  # The 128-bit tests marked #[ignore] run weekly and on manual runs only.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_LOG_STYLE: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The stable jobs use the toolchain pinned in rust-toolchain.toml. The nightly jobs name
# `+nightly` on the command line, since rust-toolchain.toml would otherwise override it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo build --all-features
      - run: cargo build --all-features --all-targets --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo build --all-features --benches --release --keep-going
      # The test profile is optimised (`[profile.test] opt-level = 3` in Cargo.toml).
      - run: cargo test --all-features

  ignored:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test --release --all-features -- --ignored

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: |
          for example in base adaptive succinct persistence offline_holder wire proofs; do
            cargo run --release --example "$example"
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  careful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-careful
      - run: cargo +nightly careful test --all-features --lib

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo doc --all-features --no-deps

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-udeps
      - run: cargo +nightly udeps --all-targets --all-features

  # A report, not a gate: the pinned toolchain holds some crates back, and an upgrade of a
  # cryptographic dependency is a decision, not a chore. criterion stays at 0.7 on purpose: 0.8
  # depends on a crate that compiles C.
  outdated:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-outdated
      - run: cargo outdated --root-deps-only --exit-code 1 --ignore criterion
